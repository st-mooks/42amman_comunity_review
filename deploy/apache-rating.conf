# =====================================================================
# Apache site for the 42 Amman Peer Rating Platform (production).
#
# Install on the Jetson:
#   sudo cp deploy/apache-rating.conf /etc/apache2/sites-available/rating.conf
#   sudo a2enmod headers
#   sudo a2ensite rating
#   sudo a2dissite 000-default      # the Apache "It works!" page is no longer needed
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Cloudflare Tunnel sends 42rating.plainbitlabs.com to http://localhost:80,
# and Apache picks this site because of ServerName below.
# =====================================================================
<VirtualHost *:80>
    ServerName 42rating.plainbitlabs.com
    ServerAlias localhost 127.0.0.1
    DocumentRoot /var/www/rating
    DirectoryIndex index.php index.html

    <Directory /var/www/rating>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Private folders: never reachable from the internet.
    #   .git      -> full history (including old passwords)
    #   config    -> database credentials
    #   database  -> schema and the demo seeder
    #   validator, deploy -> server-side code / setup files
    <DirectoryMatch "^/var/www/rating/(\.git|config|database|validator|deploy)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Hidden files and non-web files anywhere
    <FilesMatch "(^\.|\.(md|sql|sh|log|bak|swp)$)">
        Require all denied
    </FilesMatch>

    # Never show PHP errors to visitors (they go to the error log instead)
    <IfModule mod_php.c>
        php_admin_flag display_errors off
        php_admin_flag log_errors on
    </IfModule>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "same-origin"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/rating_error.log
    CustomLog ${APACHE_LOG_DIR}/rating_access.log combined
</VirtualHost>
