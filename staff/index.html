<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff dashboard · 42 Amman Peer Rating</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="icon" href="/assets/img/favicon.svg">
</head>
<body>
  <main id="main">
    <div id="dash"><div class="card"><div class="skeleton" style="height:120px"></div></div></div>
  </main>

  <script src="/assets/js/app.js"></script>
  <script>
    (async () => {
      const user = await guard('staff');
      shell(user, 'dashboard', 'Staff Dashboard');
      load();
    })();

    async function load() {
      const box = $('#dash');
      let d;
      try {
        d = await api(withWindow('/api/staff/dashboard.php'));
      } catch (e) { return showError(box, e); }

      windowPicker(d.windows, d.window, load);
      if (!d.window) {
        box.innerHTML = `<div class="card empty"><strong>No voting window yet</strong>Create one in <a href="/staff/settings.html">Voting window</a>.</div>`;
        return;
      }
      setAbuseCount(d.abuse.pending);

      const s = d.stats;
      const total = d.by_stars['3'] + d.by_stars['2'] + d.by_stars['1'];
      const pct = (n) => total ? (n / total * 100) : 0;
      const ratedPct = s.total_students ? (s.voted / s.total_students * 100).toFixed(1) : 0;

      // donut chart (conic gradient)
      const a = pct(d.by_stars['3']), b = a + pct(d.by_stars['2']);
      const donut = `<div class="donut" role="img" aria-label="Ratings by stars"
          style="border-radius:50%;background:conic-gradient(var(--green) 0 ${a}%, #dcc8ae ${a}% ${b}%, var(--red) ${b}% 100%);display:grid;place-items:center">
          <div style="width:72%;height:72%;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1.1">
            <div><strong style="font-size:24px">${total.toLocaleString()}</strong><br><span class="small">Ratings</span></div></div></div>`;

      const maxLabel = Math.max(1, ...d.top_labels.map((l) => +l.count));
      const types = d.abuse.types;
      const open = d.window.status === 'active' && new Date(d.window.end_time.replace(' ', 'T')) > new Date();

      box.innerHTML = `
        <div class="dash">
          <div class="card span4 kpi">${ICON.users}<div><div class="k-label">Total students</div><div class="k-value">${s.total_students}</div></div></div>
          <a class="card span4 kpi" href="/staff/students.html?filter=voted" style="text-decoration:none;color:inherit">${ICON.checkCircle}<div><div class="k-label">Rated</div><div class="k-value">${s.voted} <small>(${ratedPct}%)</small></div><div class="small muted">${s.not_voted} have not voted</div></div></a>
          <div class="card span4 kpi">${ICON.diamond}<div><div class="k-label">Total ratings</div><div class="k-value">${s.total_ratings.toLocaleString()}</div>${s.cancelled ? `<div class="small muted">${s.cancelled} invalidated</div>` : ''}</div></div>

          <div class="card span5">
            <h2>Ratings by Stars</h2>
            <div class="donut-row">${donut}
              <ul class="legend-list">
                <li><i style="background:var(--green)"></i><strong>3 ★</strong> ${pct(d.by_stars['3']).toFixed(1)}% (${d.by_stars['3']})</li>
                <li><i style="background:#dcc8ae"></i><strong>2 ★</strong> ${pct(d.by_stars['2']).toFixed(1)}% (${d.by_stars['2']})</li>
                <li><i style="background:var(--red)"></i><strong>1 ★</strong> ${pct(d.by_stars['1']).toFixed(1)}% (${d.by_stars['1']})</li>
              </ul>
            </div>
          </div>
          <div class="card span5">
            <div class="section-title"><h2>Top Labels</h2><a href="/staff/ratings.html?tab=label" class="small">All labels →</a></div>
            ${d.top_labels.length ? d.top_labels.map((l) => `
              <div class="hbar ${l.category}"><span>${esc(l.title)}</span><span class="track"><span style="width:${l.count / maxLabel * 100}%"></span></span><span class="n">${l.count}</span></div>`).join('')
              : '<p class="muted">No labels yet.</p>'}
          </div>
          <div class="span2">
            <div class="abuse-alert ${d.abuse.pending ? '' : 'clear'}">
              ${d.abuse.pending ? ICON.warn : ICON.checkCircle}
              <strong>Abuse Review</strong>
              <span class="small">${d.abuse.pending ? `${d.abuse.pending} unusual case${d.abuse.pending == 1 ? '' : 's'} waiting` : 'Nothing waiting for review'}</span>
              <a class="btn sm" href="/staff/abuse.html">Review</a>
            </div>
          </div>

          <div class="card span12" style="padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
            <div class="setting-row" style="padding:22px 26px">${ICON.calendar}
              <div><h3>Voting window ${open ? '<span class="chip green">open</span>' : '<span class="chip red">closed</span>'}</h3>
              <div class="small">${esc(d.window.title)}<br>${fmtDate(d.window.start_time)} – ${fmtDate(d.window.end_time)}</div></div>
              <a class="btn" href="/staff/settings.html">Edit window</a></div>
            <div class="setting-row" style="padding:22px 26px;border-left:1px solid var(--line)">${ICON.diamond}
              <div><h3>Vote limits</h3><div class="small">Min: ${d.window.min_votes_per_student} &nbsp; Max: ${d.window.max_votes_per_student}</div></div>
              <a class="btn" href="/staff/settings.html#limits">Edit limits</a></div>
          </div>

          <div class="card span7">
            <div class="section-title"><h2>Recent Activity</h2><a href="/staff/students.html" class="small">All students →</a></div>
            <div class="table-wrap"><table class="t">
              <thead><tr><th>Student</th><th class="num">Ratings given</th><th class="num">Ratings received</th><th class="num">Avg. rating</th></tr></thead>
              <tbody>${d.recent_activity.map((r) => `
                <tr class="click" data-id="${r.id}"><td>${esc(r.username)}</td><td class="num">${r.given}</td><td class="num">${r.received}</td>
                <td class="num">${r.average === null ? 'N/A' : `<span class="stars-inline">${ICON.star} ${Number(r.average).toFixed(1)}/3</span>`}</td></tr>`).join('')
                || '<tr><td colspan="4" class="empty">No votes yet in this window.</td></tr>'}</tbody>
            </table></div>
          </div>
          <div class="card span5">
            <div class="section-title"><h2>Unusual activity</h2><a href="/staff/abuse.html" class="small">View all →</a></div>
            <ul class="type-list">${Object.keys(types).map((k) => `
              <li><span style="display:flex">${ICON[types[k].icon]}</span>${esc(types[k].label)}
                ${d.abuse.by_type[k] ? `<a class="chip red" href="/staff/abuse.html?type=${k}">${d.abuse.by_type[k]} case${d.abuse.by_type[k] == 1 ? '' : 's'}</a>` : '<span class="chip">none</span>'}</li>`).join('')}
            </ul>
          </div>
        </div>`;

      $$('tr[data-id]', box).forEach((tr) => tr.addEventListener('click', () => { location.href = `/staff/students.html?student=${tr.dataset.id}`; }));
    }
  </script>
</body>
</html>
